name: ci

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: unit tests
        run: npm test
      - name: docker build
        run: docker build -t fileshare:ci .
